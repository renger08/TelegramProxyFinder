<!DOCTYPE html>
<html lang="fa">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>MTProto Proxy</title>

<!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"> -->
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
<link href="./assets/css/main.css" rel="stylesheet"/>
<script src="./assets/js/main.js"/>
<script src="https://raw.githubusercontent.com/zenorocha/clipboard.js/refs/heads/master/dist/clipboard.min.js"/>
// <script src="./assets/js/clipboard.min.js"/>
</head>
<body>

<div class="container">
  <div id="proxyBox" class="box">
    در حال بارگذاری...
  </div>

  <div class="buttons">
    <!-- <button onclick="copyText()">📋 کپی</button> -->
    <!-- <button class="buttons" data-clipboard-text="aaa" >📋 کپی</button> -->
    <button class="buttons" data-clipboard-action="copy" data-clipboard-target="#proxyBox" >📋 کپی</button>
    <button onclick="loadProxies()">🔄 رندوم جدید</button>
  </div>
</div>
<br>
<!-- <hr> -->
<div class="text">
  <p >ساخته شده با ❤️ توسط Renger08</p>
</div>
<!-- <hr> -->

<script>
  // var proxies = document.getElementById("proxyBox").textContent;

  var clipboard = new ClipboardJS('.buttons');

  clipboard.on('success', function (e) {
    console.info('Action:', e.action);
    console.info('Text:', e.text);
    console.info('Trigger:', e.trigger);

    e.clearSelection();
  });

  clipboard.on('error', function (e) {
    console.error('Action:', e.action);
    console.error('Trigger:', e.trigger);
  });

</script>
</body>
</html>
